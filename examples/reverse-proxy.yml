# This example shows how to run SWOL behind a reverse proxy without exposing its port directly by listening only on the bridge network.
# This can be extended to use any traefik features like TLS, rate limiting, etc.

name: swol

services:
  traefik:
    image: traefik:v3.3.4
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - 80:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      # Map host.docker.internal to bridge network
      - host.docker.internal:172.17.0.1

  swol:
    # Build this image locally as shown in the README before starting Compose.
    image: swol:local
    network_mode: host
    command: serve
    environment:
      WOL_CONFIG: |
        machines:
          - name: desktop
            mac: e3:2e:4a:00:00:01
        server:
          # Listen only on the bridge network
          listen: 172.17.0.1:7777
    labels:
      traefik.enable: true
      # Match every host and path
      # https://doc.traefik.io/traefik/routing/routers/#rule
      traefik.http.routers.swol.rule: PathPrefix(`/`)
      traefik.http.routers.swol.entrypoints: web
      # Create and add basic auth middleware
      # Generate credentials using `htpasswd -nb username password`
      # Note: Escaping $ in password with $$ maybe required
      traefik.http.middlewares.auth.basicauth.users: "admin:$$apr1$$Qb.3XKXp$$zR5u/t.DrvejOkMIsCSYJ0"
      traefik.http.routers.swol.middlewares: auth
      traefik.http.services.swol.loadbalancer.server.port: 7777
